
name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker Image"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH secrets
        env:
          EC2_HOST: ${{ secrets.HOST }}
          EC2_USER: ${{ secrets.USERNAME }}
          EC2_KEY: ${{ secrets.KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "HOST secret is missing" && exit 1)
          test -n "$EC2_USER" || (echo "USERNAME secret is missing" && exit 1)
          test -n "$EC2_KEY" || (echo "KEY secret is missing" && exit 1)
          echo "SSH secrets are configured."

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e

            docker pull YOUR_DOCKERHUB_USERNAME/myapp:latest

            docker stop myapp || true
            docker rm myapp || true

            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 80:8080 \
              YOUR_DOCKERHUB_USERNAME/myapp:latest

            docker ps --filter "name=myapp"
